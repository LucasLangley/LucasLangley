name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: LucasLangley
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ffd23f&color_dots=%232a2650,%23233093,%233647c2,%234456d8,%2359e0ff
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ffd23f&color_dots=%232a2650,%23233093,%233647c2,%234456d8,%2359e0ff
          
      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
